name: Build & Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect tag at HEAD
        id: version
        shell: pwsh
        run: |
          $tag = git tag --points-at HEAD | Select-Object -First 1
          if (-not $tag) {
            Write-Host "No tag at HEAD - build only, no release."
            "release=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "tag="          | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "version=0.0.0" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            $version = $tag -replace '^v',''
            Write-Host "Releasing $tag (version $version)"
            "release=true"      | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "tag=$tag"          | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "version=$version"  | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Publish (self-contained, single file)
        run: >
          dotnet publish DuplicateFinder.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ steps.version.outputs.version }}
          -o publish

      - name: Package zip
        if: steps.version.outputs.release == 'true'
        shell: pwsh
        run: |
          $zip = "DuplicateFinder-${{ steps.version.outputs.tag }}-win-x64.zip"
          Compress-Archive -Path publish\* -DestinationPath $zip
          "zip_name=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DuplicateFinder-${{ steps.version.outputs.version }}
          path: publish/
          retention-days: 14

      - name: Create GitHub Release
        if: steps.version.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: DuplicateFinder ${{ steps.version.outputs.tag }}
          files: ${{ env.zip_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
